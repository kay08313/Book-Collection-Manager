<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pokemon card collection</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    
    <link rel="icon" type="image/png" href="image/pokeball.png" />
  </head>
  <body id="mainbody">
    <nav>
      <a href="/">Sign out</a>
      <a href="/page2.html" aria-current="page">Pokemon Card Collection page</a>
    </nav>
    <main>
      <img src="image/pokemon logo.png" alt="" width="500">
      <h1 id="greeting">Welcome Kay Trainer!!!</h1>
      <br>
      <div id="title">
        
      </div>
      
      <br>
      <div class="row">
        <button id="show_your_collection" onclick=show_your_collection()>show your collection</button>
        <button id="order" onclick=orderbyname()>Order by name</button>
        <button id="order" onclick=orderbyhp()>Order by Hp</button>
        <button id="order" onclick=add_new_card()>Add New Card</button>
      </div>
      
      <br>
      <div id="input_new" style="display: none;">
        <form id="input_form" action="">
          <label for="add_img">img source :</label>
          <input id=add_img type="text">
          <label for="add_name">Pokemon name :</label>
          <input id=add_name type="text">
          <label for="add_skill">Pokemon skill :</label>
          <input id=add_skill type="text">
          <label for="add_type">Pokemon type :</label>
          <input id=add_type type="text">
          <label for="add_hp">Pokemon hp :</label>
          <input id=add_hp type="text">
          <button id="summit" onclick=summit()>summit</button>
        </form>
      
      </div>
      <div id="collection_container">

      </div>
      <br>
      
    </main>
    <script src="pokelist.js"></script>
  </body>
</html>
